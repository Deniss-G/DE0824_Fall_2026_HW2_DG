<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Responsive Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header class="header">
        <h3>1. Header</h3>
        <div class="header-content">
            <div class="brand">1.1 Brand</div>
            <nav class="nav">1.2 Global Nav</nav>
            <div class="tools">1.3 Tools</div>
        </div>
    </header>

    <section class="hero">
        <h3>2. Hero</h3>
        <div class="hero-content">
            <div class="hero-feature">2.1 Hero Feature</div>
            <div class="hero-action">2.2 Hero Call to Action</div>
        </div>
    </section>

    <aside class="ad">3. Ad</aside>

    <main class="body">
        <h3>4. Body</h3>
        <div class="body-content">
            <article class="article-feature">4.1 Article Feature</article>
            <article class="article-listing">4.2 Article Listing</article>
        </div>
    </main>

    <aside class="sidebar">
        <h3>5. Sidebar</h3>
        <div class="sidebar-feature">5.1 Sidebar Feature</div>
    </aside>

    <footer class="footer">6. Footer</footer>

</div>

</body>
</html>
